name: Build Firmware

on:
  push:
    branches:
      - "**"  # All branches
  pull_request:
    branches:
      - "**"

permissions:
  contents: write  # Required for creating releases

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: addis0n/arm-none-eabi-gcc-plus-python:wfe2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Updated from v1

      - name: Install dependencies
        run: pip install -r common/requirements.txt

      - name: Add safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build all firmware code
        run: make all

      # Determine tag based on branch (stable for main, latest for develop, branch name for others)
      - name: Set release tag
        id: set_tag
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "tag=stable" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            # Use branch name as tag, sanitize it (replace / with -)
            BRANCH_TAG=$(echo "${{ github.ref_name }}" | tr '/' '-')
            echo "tag=$BRANCH_TAG" >> $GITHUB_OUTPUT
          fi

      # Upload binaries on all pushes (not PRs)
      - name: Upload binaries to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.set_tag.outputs.tag }}
          name: Firmware Release - ${{ steps.set_tag.outputs.tag }}
          body: |
            Firmware binaries built from commit ${{ github.sha }}
            
            **Boards:**
            - BMU (Battery Management Unit)
            - PDU (Power Distribution Unit)
            - VCU (Vehicle Control Unit)
            - WSB (Wheel Speed Board)
            
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Date:** ${{ github.event.head_commit.timestamp }}
          files: |
            Bin/bmu/Release/bmu.bin
            Bin/bmu/Release/bmu.elf
            Bin/pdu/Release/pdu.bin
            Bin/pdu/Release/pdu.elf
            Bin/vcu/Release/vcu.bin
            Bin/vcu/Release/vcu.elf
            Bin/wsb/Release/wsb.bin
            Bin/wsb/Release/wsb.elf
          draft: false
          prerelease: false
          make_latest: ${{ github.ref == 'refs/heads/develop' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
